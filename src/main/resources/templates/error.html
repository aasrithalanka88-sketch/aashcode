<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Skill Swap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <nav th:replace="~{layout/navbar :: navbar}"></nav>

    <main class="container my-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-hover p-5">
                    <i class="bi bi-exclamation-octagon text-danger display-1 mb-3"></i>
                    <h3 class="fw-bold">Oops! Something went wrong</h3>
                    <p class="text-muted" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or an unexpected error occurred.'}">
                        An unexpected error occurred.
                    </p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a th:href="@{/}" class="btn btn-primary px-4">Back to Home</a>
                        <a th:href="@{/peers}" class="btn btn-outline-secondary px-4">Browse Peers</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
